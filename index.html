<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل المؤسسات التربوية بالجزائر</title>
    <style>
        :root {
            --dz-green: #008751;
            --dz-red: #d21034;
            --dz-white: #ffffff;
            --dz-gold: #c5a059;
            --text-black: #1a1a1a;
            --bg-body: #f1f3f5;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); margin: 0; color: var(--text-black); }
        
        header {
            background: linear-gradient(135deg, var(--dz-green), #006633);
            color: white; padding: 25px 20px 70px; text-align: center;
            border-bottom: 5px solid var(--dz-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .logo-box {
            width: 70px; height: 70px; background: white; border-radius: 50%;
            margin: 0 auto 10px; overflow: hidden; border: 3px solid white;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .logo-box img { width: 85%; height: 85%; object-fit: contain; }

        header h1 { margin: 0; font-size: 22px; font-weight: 800; }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

        /* شريط البحث المطور */
        .search-container {
            background: white; padding: 10px; border-radius: 50px; display: flex; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: -45px; position: relative; z-index: 10;
        }
        
        input { flex: 1; border: none; padding: 15px 25px; font-size: 16px; outline: none; border-radius: 50px; text-align: center; color: var(--text-black); }

        .search-btn {
            background: var(--dz-green); color: white; border: none;
            padding: 0 35px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .search-btn:hover { background: var(--dz-red); }

        /* نتائج البحث - أيقونات حمراء بطلبك */
        #resultArea { display: none; margin-top: 30px; animation: slideUp 0.5s ease; }
        .result-card {
            background: white; border-radius: 20px; padding: 30px;
            border-top: 8px solid var(--dz-green); box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .action-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 25px; }
        .action-btn {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            padding: 15px; background: #fff; border: 1.5px solid #eee;
            border-radius: 15px; text-decoration: none; color: var(--text-black);
            font-size: 13px; font-weight: bold; transition: 0.3s;
        }
        .action-btn:hover { border-color: var(--dz-red); transform: translateY(-3px); }
        .action-btn svg { fill: var(--dz-red); width: 28px; height: 28px; }

        /* قائمة المعاهد الوطنية */
        .section-title { margin: 50px 0 20px; border-right: 5px solid var(--dz-gold); padding-right: 15px; color: var(--dz-green); font-size: 19px; font-weight: 800; }

        .inst-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 50px; }

        .inst-card {
            background: white; border-radius: 15px; padding: 18px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f1f2f6;
            transition: 0.3s; text-decoration: none; color: inherit;
        }
        .inst-card:hover { transform: translateY(-3px); border-color: var(--dz-green); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }

        .inst-card h3 { font-size: 14px; margin: 0; font-weight: 700; color: var(--text-black); flex: 1; }
        
        .inst-icon {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: #fdf2f2; border-radius: 10px; margin-left: 15px;
        }
        .inst-icon svg { fill: var(--dz-red); width: 24px; height: 24px; }

        .dir-badge { padding: 6px 12px; background: var(--dz-red); color: white; border-radius: 20px; font-size: 11px; font-weight: bold; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        footer { text-align: center; padding: 40px; color: #adb5bd; font-size: 12px; border-top: 1px solid #eee; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="https://e.top4top.io/p_3753yucuk1.jpg" alt="وزارة التربية">
        </div>
        <h1>دليل المؤسسات التربوية بالجزائر</h1>
    </header>

    <div class="container">
        
        <div class="search-container">
            <input type="text" id="target" placeholder="ابحث عن أي مؤسسة (اسم المؤسسة + الولاية)..." onkeypress="if(event.key==='Enter') searchNow()">
            <button class="search-btn" onclick="searchNow()">بحث</button>
        </div>

        <div id="resultArea">
            <div class="result-card">
                <h2 id="resTitle" style="font-size: 18px; margin: 0 0 20px 0;"></h2>
                <div class="action-btns">
                    <a id="dirL" href="#" target="_blank" class="action-btn">
                        <svg viewBox="0 0 24 24"><path d="M22.43 10.59l-9.01-9.01c-.75-.75-1.96-.75-2.71 0l-9.01 9.01c-.75.75-.75 1.96 0 2.71l9.01 9.01c.75.75 1.96.75 2.71 0l9.01-9.01c.75-.76.75-1.97 0-2.71zM11 18V9l-4 4h9v5h-2v-3H9l2-2v5z"/></svg>
                        <span>الاتجاهات</span>
                    </a>
                    <a id="pL" href="#" target="_blank" class="action-btn">
                        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        <span>اتصال مباشر</span>
                    </a>
                    <a id="phL" href="#" target="_blank" class="action-btn">
                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        <span>الصور</span>
                    </a>
                    <a id="mL" href="#" target="_blank" class="action-btn">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        <span>الموقع</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="section-title">🏢 المعاهد الوطنية لتكوين مستخدمي التربية</div>
        
        <div class="inst-grid" id="instGrid">
            </div>

        <footer>
            جميع الحقوق محفوظة © 2026 | دليل المؤسسات التربوية
        </footer>
    </div>

    <script>
        const institutes = [
            "المعهد الوطني (الحراش) - الجزائر", "معهد تكوين مستخدمي التربية - الأغواط", 
            "معهد تكوين مستخدمي التربية - بشار", "معهد تكوين مستخدمي التربية - البليدة", 
            "معهد تكوين مستخدمي التربية - تيارت", "معهد تكوين مستخدمي التربية - سطيف", 
            "معهد تكوين مستخدمي التربية - سعيدة", "معهد تكوين مستخدمي التربية - قسنطينة", 
            "معهد تكوين مستخدمي التربية - مستغانم", "معهد تكوين مستخدمي التربية - معسكر", 
            "معهد تكوين مستخدمي التربية - ورقلة", "معهد تكوين مستخدمي التربية - وهران", 
            "معهد تكوين مستخدمي التربية - الوادي", "معهد تكوين مستخدمي التربية - ميلة", 
            "معهد تكوين مستخدمي التربية - عين تموشنت", "معهد تكوين مستخدمي التربية - غليزان"
        ];

        function loadInstitutes() {
            const grid = document.getElementById('instGrid');
            institutes.forEach(name => {
                const card = document.createElement('a');
                card.className = 'inst-card';
                card.target = '_blank';
                card.href = `https://www.google.com/maps/search/${encodeURIComponent(name)}`;
                card.innerHTML = `
                    <div class="inst-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
                    </div>
                    <h3>${name}</h3>
                    <span class="dir-badge">الاتجاهات</span>
                `;
                grid.appendChild(card);
            });
        }

        function searchNow() {
            const val = document.getElementById('target').value.trim();
            if(!val) return;
            
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('resTitle').innerText = "نتائج البحث عن: " + val;
            
            const q = encodeURIComponent(val + " التربية الجزائر");
            
            // روابط حية وطنية
            document.getElementById('dirL').href = `https://www.google.com/maps/search/${q}`;
            document.getElementById('pL').href = `https://www.google.com/search?q=numéro+téléphone+${q}`;
            document.getElementById('phL').href = `https://www.google.com/search?q=${q}&tbm=isch`;
            document.getElementById('mL').href = `https://www.google.com/maps/search/${q}`;
            
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = loadInstitutes;
    </script>
</body>
</html>
