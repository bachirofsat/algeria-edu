<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الوطنية للمؤسسات التربوية - الجزائر</title>
    <style>
        :root {
            --algeria-green: #006633;
            --algeria-red: #d21034;
            --gold-accent: #c5a059;
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, var(--algeria-green), #004d26);
            color: white;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 6px solid var(--gold-accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        header h1 { margin: 0; font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { margin: 10px 0 0; opacity: 0.9; }

        .main-container {
            max-width: 700px;
            margin: -40px auto 40px;
            padding: 0 20px;
        }

        .search-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px 25px;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
        }

        input:focus {
            border-color: var(--algeria-green);
            box-shadow: 0 0 15px rgba(0, 102, 51, 0.1);
        }

        button {
            background: var(--algeria-green);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { background: #004d26; transform: scale(1.05); }

        #resultArea { margin-top: 30px; display: none; }

        .result-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 8px solid var(--algeria-green);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .school-title { font-size: 22px; color: #1a1a1a; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        
        .badge {
            display: inline-block;
            background: #f1f5f9;
            color: #475569;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .action-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            text-decoration: none;
            color: #1e293b;
            transition: 0.3s;
        }

        .action-link:hover {
            border-color: var(--algeria-green);
            background: #ecfdf5;
            color: var(--algeria-green);
        }

        .icon { font-size: 28px; margin-bottom: 10px; }
        .label { font-size: 14px; font-weight: bold; }

        .footer-note { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>🇩🇿 المنصة الوطنية للمؤسسات التربوية</h1>
        <p>البحث الذكي عن أي مؤسسة في الـ 58 ولاية</p>
    </header>

    <div class="main-container">
        <div class="search-box">
            <div class="input-wrapper">
                <input type="text" id="targetSchool" placeholder="اكتب اسم المؤسسة والولاية (مثلاً: ثانوية العقيد لطفي وهران)..." onkeypress="if(event.key === 'Enter') searchNow()">
                <button onclick="searchNow()">بحث</button>
            </div>
        </div>

        <div id="resultArea">
            <div class="result-card">
                <div class="badge">✨ تم تحليل الطلب بنجاح</div>
                <div class="school-title" id="displayTitle"></div>
                
                <div class="action-grid">
                    <a id="phoneLink" href="#" target="_blank" class="action-link">
                        <span class="icon">📞</span>
                        <span class="label">رقم الهاتف</span>
                    </a>
                    <a id="mapLink" href="#" target="_blank" class="action-link">
                        <span class="icon">📍</span>
                        <span class="label">الموقع الجغرافي</span>
                    </a>
                    <a id="photoLink" href="#" target="_blank" class="action-link">
                        <span class="icon">📸</span>
                        <span class="label">معرض الصور</span>
                    </a>
                    <a id="webLink" href="#" target="_blank" class="action-link">
                        <span class="icon">🌐</span>
                        <span class="label">فيسبوك / موقع</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="footer-note">
            تم التطوير بواسطة م. حميدي بشير | جميع البيانات يتم جلبها حياً من محركات البحث العالمية
        </div>
    </div>

    <script>
        function searchNow() {
            const input = document.getElementById('targetSchool').value.trim();
            if (!input) {
                alert("من فضلك اكتب اسم المؤسسة والولاية أولاً!");
                return;
            }

            const area = document.getElementById('resultArea');
            const title = document.getElementById('displayTitle');
            
            // إظهار منطقة النتائج
            area.style.display = 'block';
            title.innerText = input;

            // هندسة الروابط الذكية للبحث الوطني
            const q = encodeURIComponent(input);

            // 1. رابط الهاتف (جوجل سيرش مباشر)
            document.getElementById('phoneLink').href = `https://www.google.com/search?q=numéro+téléphone+${q}`;
            
            // 2. رابط الخريطة
            document.getElementById('mapLink').href = `https://www.google.com/maps/search/${q}`;
            
            // 3. رابط الصور
            document.getElementById('photoLink').href = `https://www.google.com/search?q=${q}&tbm=isch`;
            
            // 4. رابط فيسبوك (الأكثر استخداماً في الجزائر)
            document.getElementById('webLink').href = `https://www.google.com/search?q=site:facebook.com+${q}`;
            
            // تمرير الشاشة للنتائج
            area.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
